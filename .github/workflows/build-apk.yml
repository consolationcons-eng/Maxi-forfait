name: Construire MAXI FORFAIT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Préparer Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install -D @capacitor/cli@6

      - name: Préparer les fichiers
        run: |
          mkdir www
          cp index.html www/
          cp manifest.json www/
          cp icon-192-1.png www/
          cp icon-512-1.png www/

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.consolationcons.maxiforfait",
            "appName": "MAXI FORFAIT",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Installer Pillow
        run: pip install Pillow

      - name: Installer le logo comme icône Android
        run: |
          python - <<'PY'
          from PIL import Image
          import os

          source = Image.open("icon-512-1.png").convert("RGBA")

          folders = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          base = "android/app/src/main/res"

          for density, size in folders.items():
              folder = f"{base}/mipmap-{density}"
              os.makedirs(folder, exist_ok=True)

              icon = source.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(f"{folder}/ic_launcher.png")
              icon.save(f"{folder}/ic_launcher_round.png")

          print("Logo MAXI FORFAIT installé !")
          PY

      - name: Construire APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Télécharger APK
        uses: actions/upload-artifact@v4
        with:
          name: MAXI-FORFAIT-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
