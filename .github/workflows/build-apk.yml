name: Construire MAXI FORFAIT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Préparer Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install -D @capacitor/cli@6

      - name: Préparer les fichiers
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp icon-192-1.png www/
          cp icon-512-1.png www/

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.consolationcons.maxiforfait",
            "appName": "MAXI FORFAIT",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Installer Pillow
        run: pip install Pillow

      - name: Installer le logo Android
        run: |
          python - <<'PY'
          from PIL import Image
          import os

          source = Image.open("icon-512-1.png").convert("RGBA")

          folders = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          base = "android/app/src/main/res"

          for density, size in folders.items():
              folder = f"{base}/mipmap-{density}"
              os.makedirs(folder, exist_ok=True)

              icon = source.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(f"{folder}/ic_launcher.png")
              icon.save(f"{folder}/ic_launcher_round.png")

          print("Logo MAXI FORFAIT installé !")
          PY

      - name: Corriger les icônes adaptatives
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Récupérer et vérifier la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/maxiforfait-release.jks

          test -s android/maxiforfait-release.jks

          keytool -list \
            -keystore android/maxiforfait-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "Clé de signature vérifiée !"

      - name: Configurer la signature Android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python - <<'PY'
          import re

          path = "android/app/build.gradle"

          with open(path, "r") as f:
              content = f.read()

          if "signingConfigs {" in content:
              raise SystemExit("Une configuration de signature existe déjà.")

          signing = """
          signingConfigs {
              release {
                  storeFile file("../maxiforfait-release.jks")
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }

          """

          pattern = r'(\n[ \t]*)buildTypes\s*\{'

          def insert_signing(match):
              indent = match.group(1)
              return indent + signing + indent + "buildTypes {"

          content, count = re.subn(
              pattern,
              insert_signing,
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("Impossible de trouver buildTypes.")

          content, count = re.subn(
              r'(buildTypes\s*\{\s*release\s*\{)',
              r'\1\n            signingConfig signingConfigs.release',
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("Impossible de configurer Release.")

          with open(path, "w") as f:
              f.write(content)

          print("Signature Android configurée !")
          PY

      - name: Construire APK Release signé
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Vérifier la signature
        run: |
          jarsigner -verify android/app/build/outputs/apk/release/app-release.apk

      - name: Télécharger APK final
        uses: actions/upload-artifact@v4
        with:
          name: MAXI-FORFAIT-APK-RELEASE
          path: android/app/build/outputs/apk/release/app-release.apk
